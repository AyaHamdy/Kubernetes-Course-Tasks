apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: webapp-api
spec:
  replicas: {{ .Values.app.replicaCount }}
  selector:
    matchLabels:
      app: webapp-api
  template:
    metadata:
      labels:
        app: webapp-api
    spec:
      containers:
      - name: webapp-api
        image: "{{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: webapp-config
        env:
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: app-user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: app-password
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-api
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: webapp-api
  ports:
  - port: 80
    targetPort: 8000
