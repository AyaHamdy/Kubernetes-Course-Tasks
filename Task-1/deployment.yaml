apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: webapp
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      shareProcessNamespace: true
      initContainers:
      - name: init-done
        image: busybox:1.36
        command: ["sh", "-c", "echo done"]
      containers:
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        command: ["sh", "-c"]
        args:
        - |
          echo "hello in MLOPS MENA COMMUNITY : $(date +%F' '%T)" > /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'
      - name: time-updater
        image: busybox:1.36
        securityContext:
          runAsUser: 0
        command: ["sh", "-c"]
        args:
        - |
          while true; do
            PID=$(pgrep -o nginx)
            echo "hello in MLOPS MENA COMMUNITY : $(date +%F' '%T)" > /proc/$PID/root/usr/share/nginx/html/index.html
            sleep 5
          done
